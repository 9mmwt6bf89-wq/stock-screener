name: 更新K线数据

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 北京时间周一到周五15:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python update_kline.py
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kline.json
          git diff --staged --quiet || git commit -m "auto: 更新K线数据 $(date -u +%Y-%m-%d)"
          git push
